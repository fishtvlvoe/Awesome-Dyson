<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開發儀表板</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --text: #000000;
      --text-secondary: #666666;
      --border: #e0e0e0;
      --accent: #0066cc;
      --status-ok: #00aa44;
      --status-warn: #ff8800;
      --status-error: #dd0000;
    }

    html.dark-mode {
      --bg: #1a1a1a;
      --bg-secondary: #2a2a2a;
      --text: #ffffff;
      --text-secondary: #aaaaaa;
      --border: #404040;
      --accent: #66b3ff;
      --status-ok: #44dd77;
      --status-warn: #ffaa33;
      --status-error: #ff5555;
    }

    @media (prefers-color-scheme: dark) {
      html:not(.light-mode) {
        --bg: #1a1a1a;
        --bg-secondary: #2a2a2a;
        --text: #ffffff;
        --text-secondary: #aaaaaa;
        --border: #404040;
        --accent: #66b3ff;
        --status-ok: #44dd77;
        --status-warn: #ffaa33;
        --status-error: #ff5555;
      }
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      background: var(--bg-secondary);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .logo {
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .logo-icon {
      display: inline-block;
      margin-right: 8px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-title {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 2.5em;
      font-weight: bold;
      line-height: 1.2;
    }

    .updated-info {
      font-size: 0.85em;
      color: var(--text-secondary);
      font-weight: normal;
    }

    .one-liner {
      font-size: 1.15em;
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-weight: 500;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon {
      display: inline-block;
      font-size: 1.2em;
    }

    .change-item {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .change-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .change-name {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .change-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9em;
      color: var(--text-secondary);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-ok {
      background: var(--status-ok);
    }

    .status-warn {
      background: var(--status-warn);
    }

    .status-error {
      background: var(--status-error);
    }

    .progress-bar {
      background: var(--border);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .question-item {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .question-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .question-text {
      margin-bottom: 4px;
    }

    .question-asked {
      font-size: 0.85em;
      color: var(--text-secondary);
    }

    .timeline {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 2px solid var(--border);
    }

    .timeline h2 {
      font-weight: bold;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.3em;
    }

    .timeline-item {
      margin-bottom: 24px;
      position: relative;
      padding-left: 32px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 6px;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      border: 2px solid var(--bg);
      box-shadow: inset 0 0 0 2px var(--border);
    }

    .timeline-item::after {
      content: '';
      position: absolute;
      left: 14px;
      top: 18px;
      width: 2px;
      height: calc(100% + 18px);
      background: var(--border);
    }

    .timeline-item:last-child::after {
      display: none;
    }

    .timeline-item-header {
      cursor: pointer;
      user-select: none;
    }

    .timeline-item-header:hover {
      opacity: 0.8;
    }

    .timeline-date {
      font-size: 0.85em;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .timeline-topic {
      font-weight: bold;
      margin-top: 4px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timeline-expand-icon {
      display: inline-block;
      transition: transform 0.2s ease;
      font-size: 0.8em;
    }

    .timeline-expand-icon.expanded {
      transform: rotate(90deg);
    }

    .timeline-details {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .timeline-details.visible {
      display: block;
    }

    .timeline-summary {
      font-size: 0.95em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .timeline-decisions {
      font-size: 0.9em;
      margin-top: 8px;
    }

    .timeline-decision {
      background: var(--bg);
      padding: 6px 8px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 6px;
      margin-bottom: 4px;
      border-left: 3px solid var(--accent);
    }

    .error {
      background: var(--status-error);
      color: white;
      padding: 16px;
      border-radius: 6px;
      margin: 20px 0;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-style: italic;
      color: var(--text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text-secondary);
    }

    .connected-systems {
      margin-top: 24px;
    }

    .connected-systems-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .system-tag {
      background: var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9em;
      color: var(--text);
    }

    .key-files-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .file-tag {
      background: var(--border);
      padding: 6px 12px;
      border-radius: 3px;
      font-size: 0.9em;
      color: var(--text);
      font-family: 'Monaco', 'Menlo', monospace;
    }

    .theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.2em;
      z-index: 1000;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8em;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">▶</span>
        專案開發儀表板
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="app">
        <div class="loading">載入中...</div>
      </div>
    </div>
  </main>

  <button class="theme-toggle" title="切換深色/淺色模式" onclick="toggleTheme()">🌙</button>

  <script>
    const APP_CONTAINER = document.getElementById('app');
    const THEME_STORAGE_KEY = 'dev-dashboard-theme';

    // Theme management
    function initTheme() {
      const saved = localStorage.getItem(THEME_STORAGE_KEY);
      const html = document.documentElement;

      html.classList.remove('light-mode', 'dark-mode');

      if (saved === 'light') {
        html.classList.add('light-mode');
      } else if (saved === 'dark') {
        html.classList.add('dark-mode');
      }

      updateThemeButton();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = localStorage.getItem(THEME_STORAGE_KEY) || 'auto';
      const next = current === 'dark' ? 'light' : (current === 'light' ? 'auto' : 'dark');

      localStorage.setItem(THEME_STORAGE_KEY, next);

      html.classList.remove('light-mode', 'dark-mode');
      if (next === 'light') {
        html.classList.add('light-mode');
      } else if (next === 'dark') {
        html.classList.add('dark-mode');
      }

      updateThemeButton();
    }

    function updateThemeButton() {
      const current = localStorage.getItem(THEME_STORAGE_KEY) || 'auto';
      const btn = document.querySelector('.theme-toggle');
      if (current === 'dark') {
        btn.textContent = '☀️';
      } else if (current === 'light') {
        btn.textContent = '🌙';
      } else {
        btn.textContent = '🌗';
      }
    }

    // Data loading
    async function loadDashboard() {
      try {
        const [stateResponse, manifestResponse] = await Promise.all([
          fetch('./state.json'),
          fetch('./entries/manifest.json')
        ]);

        if (!stateResponse.ok) {
          throw new Error(`Failed to fetch state.json: ${stateResponse.status}`);
        }

        const state = await stateResponse.json();
        const manifest = manifestResponse.ok ? await manifestResponse.json() : { entries: [] };

        renderDashboard(state, manifest);
      } catch (error) {
        APP_CONTAINER.innerHTML = `<div class="error">Error loading dashboard: ${escapeHtml(error.message)}</div>`;
      }
    }

    function renderDashboard(state, manifest) {
      const project = state.project || '未命名專案';
      const oneLiner = state.one_liner || '無描述';

      // Update page title dynamically
      document.title = `${project} 開發儀表板`;
      const changesInProgress = state.changes_in_progress || [];
      const openQuestions = state.open_questions || [];
      const keyFiles = state.key_files || [];
      const connectedSystems = state.connected_systems || [];
      const updatedAt = state.updated_at || 'Unknown';
      const updatedBy = state.updated_by || 'Unknown';

      let html = `
        <div class="page-title">
          <h1>${escapeHtml(project)}</h1>
          <div class="updated-info">
            更新人：${escapeHtml(updatedBy)}<br>
            ${formatTimestamp(updatedAt)}
          </div>
        </div>
        <div class="one-liner">${escapeHtml(oneLiner)}</div>

        <div class="cards-grid">
      `;

      // Changes in Progress card
      if (changesInProgress && changesInProgress.length > 0) {
        html += `
          <div class="card">
            <h2><span class="card-icon">📋</span> 進行中的任務</h2>
        `;
        changesInProgress.forEach(change => {
          const percent = change.total ? Math.round((change.done / change.total) * 100) : 0;
          const statusClass = change.status === 'ok' ? 'status-ok' : (change.status === 'warn' ? 'status-warn' : 'status-error');
          html += `
            <div class="change-item">
              <div class="change-name">${escapeHtml(change.name || '未命名')}</div>
              <div class="change-status">
                <span class="status-dot ${statusClass}"></span>
                ${change.done}/${change.total} 已完成
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${percent}%"></div>
              </div>
              ${change.note ? `<div style="font-size: 0.85em; color: var(--text-secondary); margin-top: 6px;">Note: ${escapeHtml(change.note)}</div>` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      // Open Questions card
      if (openQuestions && openQuestions.length > 0) {
        html += `
          <div class="card">
            <h2><span class="card-icon">❓</span> 待確認事項</h2>
        `;
        openQuestions.forEach(q => {
          html += `
            <div class="question-item">
              <div class="question-text">${escapeHtml(q.question || '無問題文字')}</div>
              <div class="question-asked">提問時間：${formatTimestamp(q.asked_at)}</div>
            </div>
          `;
        });
        html += `</div>`;
      }

      // Key Files & Systems card
      html += `<div class="card">`;
      if (keyFiles && keyFiles.length > 0) {
        html += `
          <div class="key-files">
            <h2><span class="card-icon">📁</span> 重要檔案</h2>
            <div class="key-files-list">
        `;
        keyFiles.forEach(file => {
          html += `<span class="file-tag">${escapeHtml(file)}</span>`;
        });
        html += `</div></div>`;
      }
      if (connectedSystems && connectedSystems.length > 0) {
        html += `
          <div class="connected-systems">
            <div style="font-weight: bold; margin-bottom: 8px;"><span class="card-icon">⚙️</span> 關聯系統</div>
            <div class="connected-systems-list">
        `;
        connectedSystems.forEach(system => {
          html += `<span class="system-tag">${escapeHtml(system)}</span>`;
        });
        html += `</div></div>`;
      }
      if ((keyFiles && keyFiles.length === 0) && (!connectedSystems || connectedSystems.length === 0)) {
        html += `<div class="empty-state">沒有設定重要檔案或系統</div>`;
      }
      html += `</div>`;

      html += `</div>`;

      // Timeline / History
      if (manifest.entries && manifest.entries.length > 0) {
        html += `
          <div class="timeline">
            <h2><span class="card-icon">📜</span> 歷史紀錄</h2>
        `;
        manifest.entries.forEach((entry, idx) => {
          const entryId = `entry-${idx}`;
          html += `
            <div class="timeline-item">
              <div class="timeline-item-header" onclick="toggleTimelineEntry('${entryId}')">
                <div class="timeline-date">${escapeHtml(entry.date)}</div>
                <div class="timeline-topic">
                  <span class="timeline-expand-icon" id="${entryId}-icon">▶</span>
                  ${escapeHtml(entry.topic)}
                </div>
              </div>
              <div class="timeline-details" id="${entryId}-details">
                <div class="timeline-summary" id="${entryId}-summary">載入中...</div>
                <div class="timeline-decisions" id="${entryId}-decisions"></div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      APP_CONTAINER.innerHTML = html;

      // Load entry details asynchronously
      if (manifest.entries && manifest.entries.length > 0) {
        manifest.entries.forEach((entry, idx) => {
          const entryId = `entry-${idx}`;
          loadEntryDetails(entryId, entry.file);
        });
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTimestamp(ts) {
      if (!ts) return '未知';
      try {
        const date = new Date(ts);
        const now = new Date();
        const diff = now - date;
        const seconds = Math.floor(diff / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);

        if (days > 0) return `${days} 天前`;
        if (hours > 0) return `${hours} 小時前`;
        if (minutes > 0) return `${minutes} 分鐘前`;
        return '剛才';
      } catch (e) {
        return ts;
      }
    }

    // Timeline interactions
    function toggleTimelineEntry(entryId) {
      const detailsEl = document.getElementById(`${entryId}-details`);
      const iconEl = document.getElementById(`${entryId}-icon`);

      if (detailsEl) {
        detailsEl.classList.toggle('visible');
        iconEl?.classList.toggle('expanded');
      }
    }

    async function loadEntryDetails(entryId, filename) {
      try {
        const response = await fetch(`./entries/${filename}`);
        if (!response.ok) {
          throw new Error(`無法載入紀錄: ${filename}`);
        }
        const entry = await response.json();

        // Update summary
        const summaryEl = document.getElementById(`${entryId}-summary`);
        if (summaryEl) {
          summaryEl.textContent = entry.summary || '無摘要';
        }

        // Update decisions
        const decisionsEl = document.getElementById(`${entryId}-decisions`);
        if (decisionsEl && entry.decisions && entry.decisions.length > 0) {
          let decisionsHtml = '<div style="font-weight: bold; margin-bottom: 6px;">決策事項：</div>';
          entry.decisions.forEach(decision => {
            decisionsHtml += `<div class="timeline-decision">${escapeHtml(decision)}</div>`;
          });
          decisionsEl.innerHTML = decisionsHtml;
        }
      } catch (error) {
        const summaryEl = document.getElementById(`${entryId}-summary`);
        if (summaryEl) {
          summaryEl.innerHTML = `<span style="color: var(--status-error);">載入錯誤：${escapeHtml(error.message)}</span>`;
        }
      }
    }

    // Initialize
    initTheme();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadDashboard);
    } else {
      loadDashboard();
    }
  </script>
</body>
</html>
