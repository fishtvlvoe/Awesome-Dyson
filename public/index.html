<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開發儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 設計系統：見 ../design-system/tokens.md（來源 vibeprompts.dev Dashboards
    // 分類的真實 Tailwind 原始碼）。深色模式走 class 策略，配色邏輯不變，只反轉亮度。
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-50">

  <div class="flex min-h-screen">
    <!-- 側邊欄：來源 design-system/examples/vibeprompts-sidebar-stat-cards.html -->
    <aside class="hidden w-60 flex-shrink-0 flex-col border-r border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-4 lg:flex">
      <div class="mb-6 flex items-center gap-2 px-2 font-semibold text-neutral-900 dark:text-neutral-50">
        <span class="flex h-6 w-6 items-center justify-center rounded-md bg-neutral-900 dark:bg-neutral-50 text-white dark:text-neutral-900">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
        </span>
        待神
      </div>
      <p class="px-2 mb-2 text-[11px] font-semibold uppercase tracking-wide text-neutral-400">檢視</p>
      <nav class="space-y-1 text-sm">
        <a href="#overview" class="flex items-center gap-2 rounded-lg bg-neutral-900 dark:bg-neutral-50 px-3 py-2 font-medium text-white dark:text-neutral-900">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          現況總覽
        </a>
        <a href="#history" class="flex items-center gap-2 rounded-lg px-3 py-2 text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
          歷史紀錄
        </a>
      </nav>
      <div class="mt-auto">
        <a href="https://github.com/fishtvlvoe/Awesome-Dyson" target="_blank" rel="noopener noreferrer"
           class="flex items-center gap-2 rounded-lg p-2 text-sm text-neutral-500 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 flex-shrink-0"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
          原始碼倉庫
        </a>
      </div>
    </aside>

    <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
      <div class="max-w-6xl mx-auto">
        <div id="app">
          <div class="text-center py-16 text-sm text-neutral-400">載入中...</div>
        </div>
      </div>
    </main>
  </div>

  <button id="theme-toggle" onclick="toggleTheme()"
    class="fixed bottom-5 right-5 flex items-center justify-center h-10 w-10 rounded-lg border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300 hover:bg-neutral-50 dark:hover:bg-neutral-700 shadow-sm z-50"
    title="切換深色/淺色模式"></button>

  <script>
    const APP_CONTAINER = document.getElementById('app');
    const THEME_STORAGE_KEY = 'dev-dashboard-theme';

    const SVG_WRAP_OPEN = '<svg class="h-full w-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
    const ICONS = {
      target: SVG_WRAP_OPEN + '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
      info: SVG_WRAP_OPEN + '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11.5"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/></svg>',
      checklist: SVG_WRAP_OPEN + '<rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="M9 12l2 2 4-4"/></svg>',
      question: SVG_WRAP_OPEN + '<circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 4"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>',
      plug: SVG_WRAP_OPEN + '<path d="M9 2v6M15 2v6M6 10h12v4a6 6 0 0 1-12 0v-4z"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>',
      image: SVG_WRAP_OPEN + '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
      code: SVG_WRAP_OPEN + '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>',
      history: SVG_WRAP_OPEN + '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      gift: SVG_WRAP_OPEN + '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 1 1 0-5C11 3 12 8 12 8"/><path d="M16.5 8a2.5 2.5 0 1 0 0-5C13 3 12 8 12 8"/></svg>',
      layers: SVG_WRAP_OPEN + '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
      barChart: SVG_WRAP_OPEN + '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
      headset: SVG_WRAP_OPEN + '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>',
      wrench: SVG_WRAP_OPEN + '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
      chevron: SVG_WRAP_OPEN + '<polyline points="9 18 15 12 9 6"/></svg>',
      sun: SVG_WRAP_OPEN + '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
      moon: SVG_WRAP_OPEN + '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      circleHalf: SVG_WRAP_OPEN + '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor" stroke="none"/></svg>',
      check: SVG_WRAP_OPEN + '<polyline points="20 6 9 17 4 12"/></svg>',
    };
    const CHANGE_ICON_FALLBACK = ICONS.wrench;

    // 狀態 → 語意色，統一對照表（design-system/tokens.md 的狀態色規則）
    const STATUS_META = {
      ok: { label: '快做完了', pill: 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300', dot: 'bg-green-500', text: 'text-green-600 dark:text-green-400' },
      warn: { label: '正常進行', pill: 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300', dot: 'bg-amber-500', text: 'text-amber-600 dark:text-amber-400' },
      error: { label: '等你決定', pill: 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300', dot: 'bg-red-500', text: 'text-red-600 dark:text-red-400' },
    };

    function statusMeta(status) {
      return STATUS_META[status] || STATUS_META.warn;
    }

    // Theme management — 三態（light/dark/auto），dark 用 <html class="dark"> 驅動 Tailwind
    function effectiveIsDark(pref) {
      if (pref === 'dark') return true;
      if (pref === 'light') return false;
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function applyTheme() {
      const pref = localStorage.getItem(THEME_STORAGE_KEY) || 'auto';
      document.documentElement.classList.toggle('dark', effectiveIsDark(pref));
      updateThemeButton(pref);
    }

    function toggleTheme() {
      const current = localStorage.getItem(THEME_STORAGE_KEY) || 'auto';
      const next = current === 'dark' ? 'light' : (current === 'light' ? 'auto' : 'dark');
      localStorage.setItem(THEME_STORAGE_KEY, next);
      applyTheme();
    }

    function updateThemeButton(pref) {
      const btn = document.getElementById('theme-toggle');
      if (pref === 'dark') {
        btn.innerHTML = `<span class="h-4 w-4">${ICONS.sun}</span>`;
      } else if (pref === 'light') {
        btn.innerHTML = `<span class="h-4 w-4">${ICONS.moon}</span>`;
      } else {
        btn.innerHTML = `<span class="h-4 w-4">${ICONS.circleHalf}</span>`;
      }
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      const pref = localStorage.getItem(THEME_STORAGE_KEY) || 'auto';
      if (pref === 'auto') applyTheme();
    });

    // Data loading
    async function loadDashboard() {
      try {
        const [stateResponse, manifestResponse] = await Promise.all([
          fetch('./state.json'),
          fetch('./entries/manifest.json')
        ]);

        if (!stateResponse.ok) {
          throw new Error(`Failed to fetch state.json: ${stateResponse.status}`);
        }

        const state = await stateResponse.json();
        const manifest = manifestResponse.ok ? await manifestResponse.json() : { entries: [] };

        renderDashboard(state, manifest);
      } catch (error) {
        APP_CONTAINER.innerHTML = `
          <div class="rounded-2xl border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 p-6 text-sm">
            Error loading dashboard: ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function renderDashboard(state, manifest) {
      const project = state.project || '未命名專案';
      const oneLiner = state.one_liner || '無描述';

      document.title = `${project} 開發儀表板`;

      const about = state.about || null;
      const screenshots = state.screenshots || [];
      const changesInProgress = state.changes_in_progress || [];
      const openQuestions = state.open_questions || [];
      const keyFiles = state.key_files || [];
      const connectedSystems = state.connected_systems || [];
      const updatedAt = state.updated_at || 'Unknown';
      const updatedBy = state.updated_by || 'Unknown';

      const inProgressCount = changesInProgress.length;
      const avgPercent = inProgressCount
        ? Math.round(changesInProgress.reduce((sum, c) => sum + (c.total ? (c.done / c.total) * 100 : 0), 0) / inProgressCount)
        : 0;
      const openQuestionsCount = openQuestions.length;
      const stuckCount = changesInProgress.filter(c => c.status === 'error').length;

      let html = `
        <div class="mb-1 text-xs font-semibold uppercase tracking-wide text-neutral-400">專案開發儀表板</div>
        <div class="flex flex-wrap items-baseline gap-4 mb-1">
          <h1 class="text-3xl font-extrabold tracking-tight text-neutral-900 dark:text-neutral-50">${escapeHtml(project)}</h1>
          <div class="text-xs text-neutral-400">
            更新人：${escapeHtml(updatedBy)}<br>
            ${formatTimestamp(updatedAt)}
          </div>
        </div>
        <p class="text-neutral-600 dark:text-neutral-300 mb-6 max-w-2xl">${escapeHtml(oneLiner)}</p>

        <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4 mb-8">
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800 p-5">
            <p class="text-sm text-neutral-500 dark:text-neutral-400">進行中專案</p>
            <p class="mt-2 text-2xl font-semibold text-neutral-900 dark:text-neutral-50">${inProgressCount}</p>
          </div>
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800 p-5">
            <p class="text-sm text-neutral-500 dark:text-neutral-400">平均完成度</p>
            <p class="mt-2 text-2xl font-semibold text-neutral-900 dark:text-neutral-50">${avgPercent}%</p>
          </div>
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800 p-5">
            <p class="text-sm text-neutral-500 dark:text-neutral-400">待確認事項</p>
            <p class="mt-2 text-2xl font-semibold text-neutral-900 dark:text-neutral-50">${openQuestionsCount}</p>
          </div>
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800 p-5">
            <p class="text-sm text-neutral-500 dark:text-neutral-400">卡住等你決定</p>
            <p class="mt-2 text-2xl font-semibold ${stuckCount > 0 ? 'text-red-600 dark:text-red-400' : 'text-neutral-900 dark:text-neutral-50'}">${stuckCount}</p>
            ${stuckCount > 0 ? `<p class="mt-1 text-xs text-red-600 dark:text-red-400">需要你裁決</p>` : `<p class="mt-1 text-xs text-green-600 dark:text-green-400">目前沒有卡住</p>`}
          </div>
        </div>
      `;

      // About card
      if (about) {
        html += `
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800 p-6 mb-6">
            <h2 class="flex items-center gap-2 font-semibold text-neutral-900 dark:text-neutral-50 mb-4">
              <span class="h-4 w-4 text-neutral-400">${ICONS.info}</span>
              專案說明與使用範圍
            </h2>
            <div class="grid gap-6 sm:grid-cols-3 mb-5">
              ${about.what ? `<div><h3 class="text-[11px] font-semibold uppercase tracking-wide text-neutral-400 mb-1.5">這是什麼</h3><p class="text-sm text-neutral-600 dark:text-neutral-300 leading-relaxed">${escapeHtml(about.what)}</p></div>` : ''}
              ${about.how ? `<div><h3 class="text-[11px] font-semibold uppercase tracking-wide text-neutral-400 mb-1.5">怎麼運作</h3><p class="text-sm text-neutral-600 dark:text-neutral-300 leading-relaxed">${escapeHtml(about.how)}</p></div>` : ''}
              ${about.why ? `<div><h3 class="text-[11px] font-semibold uppercase tracking-wide text-neutral-400 mb-1.5">為什麼要做</h3><p class="text-sm text-neutral-600 dark:text-neutral-300 leading-relaxed">${escapeHtml(about.why)}</p></div>` : ''}
            </div>
            ${(about.features && about.features.length > 0) ? `
              <h3 class="text-[11px] font-semibold uppercase tracking-wide text-neutral-400 mb-2">目前包含的功能</h3>
              <div class="flex flex-wrap gap-2">
                ${about.features.map(f => `<span class="rounded-full bg-neutral-100 dark:bg-neutral-700 px-2.5 py-1 text-xs text-neutral-600 dark:text-neutral-300">${escapeHtml(f)}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      // Screenshots card
      if (screenshots && screenshots.length > 0) {
        html += `
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800 p-6 mb-6">
            <h2 class="flex items-center gap-2 font-semibold text-neutral-900 dark:text-neutral-50 mb-4">
              <span class="h-4 w-4 text-neutral-400">${ICONS.image}</span>
              畫面長怎樣
            </h2>
            <div class="grid gap-4 sm:grid-cols-2">
              ${screenshots.map(shot => `
                <figure>
                  <img src="${escapeHtml(shot.path)}" alt="${escapeHtml(shot.label || '')}" loading="lazy"
                       class="w-full rounded-xl border border-neutral-200 dark:border-neutral-700">
                  ${shot.label ? `<figcaption class="mt-2 text-xs text-neutral-400">${escapeHtml(shot.label)}</figcaption>` : ''}
                </figure>
              `).join('')}
            </div>
          </div>
        `;
      }

      html += `<div class="grid gap-6 lg:grid-cols-3 mb-8">`;

      // Changes in Progress — list card, 1 row per item inside a bordered white panel
      if (changesInProgress && changesInProgress.length > 0) {
        html += `
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800 lg:col-span-2">
            <div class="flex items-center justify-between border-b border-neutral-200 dark:border-neutral-700 p-4">
              <h2 class="flex items-center gap-2 font-semibold text-neutral-900 dark:text-neutral-50">
                <span class="h-4 w-4 text-neutral-400">${ICONS.checklist}</span>
                現在在做的事
                <span class="text-sm font-normal text-neutral-400">${changesInProgress.length}</span>
              </h2>
              <div class="hidden sm:flex items-center gap-3 text-xs text-neutral-400">
                <span class="inline-flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-green-500"></span>快做完了</span>
                <span class="inline-flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>正常進行</span>
                <span class="inline-flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>卡住了</span>
              </div>
            </div>
            <div class="divide-y divide-neutral-100 dark:divide-neutral-700">
              ${changesInProgress.map(change => {
                const percent = change.total ? Math.round((change.done / change.total) * 100) : 0;
                const meta = statusMeta(change.status);
                const icon = ICONS[change.icon] || CHANGE_ICON_FALLBACK;
                const displayName = change.display_name || change.name || '未命名';
                return `
                  <div class="p-4">
                    <div class="flex items-start justify-between gap-3 mb-1.5">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="h-4 w-4 text-neutral-400 flex-shrink-0">${icon}</span>
                        <span class="font-medium text-neutral-900 dark:text-neutral-50 truncate">${escapeHtml(displayName)}</span>
                      </div>
                      <span class="flex-shrink-0 inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-medium ${meta.pill}">${meta.label}</span>
                    </div>
                    ${change.plain_summary ? `<p class="text-sm text-neutral-500 dark:text-neutral-400 mb-2">${escapeHtml(change.plain_summary)}</p>` : ''}
                    <div class="flex items-center gap-2 mb-2">
                      <div class="flex-1 h-1.5 rounded-full bg-neutral-100 dark:bg-neutral-700 overflow-hidden">
                        <div class="h-full rounded-full bg-neutral-900 dark:bg-neutral-50" style="width: ${percent}%"></div>
                      </div>
                      <span class="text-xs text-neutral-400 tabular-nums flex-shrink-0">${change.done}/${change.total}</span>
                    </div>
                    ${change.detail ? `<p class="text-sm text-neutral-600 dark:text-neutral-300 leading-relaxed">${renderDetailText(change.detail)}</p>` : (change.note ? `<p class="text-sm text-neutral-600 dark:text-neutral-300">${escapeHtml(change.note)}</p>` : '')}
                    ${change.link ? `<a href="${escapeHtml(change.link)}" target="_blank" rel="noopener noreferrer" class="mt-2 inline-flex items-center gap-1 text-sm font-medium text-neutral-900 dark:text-neutral-50 hover:underline">查看完整規格 <span class="h-3.5 w-3.5">${ICONS.chevron}</span></a>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      html += `<div class="flex flex-col gap-6">`;

      // Open Questions card
      if (openQuestions && openQuestions.length > 0) {
        html += `
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800">
            <div class="border-b border-neutral-200 dark:border-neutral-700 p-4">
              <h2 class="flex items-center gap-2 font-semibold text-neutral-900 dark:text-neutral-50">
                <span class="h-4 w-4 text-neutral-400">${ICONS.question}</span>
                待確認事項
              </h2>
            </div>
            <div class="divide-y divide-neutral-100 dark:divide-neutral-700">
              ${openQuestions.map(q => `
                <div class="p-4">
                  <p class="text-sm text-neutral-700 dark:text-neutral-200 leading-relaxed">${escapeHtml(q.question || '無問題文字')}</p>
                  <p class="mt-1.5 text-xs text-neutral-400">提問時間：${formatTimestamp(q.asked_at)}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Connected systems card
      if (connectedSystems && connectedSystems.length > 0) {
        html += `
          <div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800">
            <div class="border-b border-neutral-200 dark:border-neutral-700 p-4">
              <h2 class="flex items-center gap-2 font-semibold text-neutral-900 dark:text-neutral-50">
                <span class="h-4 w-4 text-neutral-400">${ICONS.plug}</span>
                關聯系統
              </h2>
            </div>
            <div class="p-4 flex flex-wrap gap-2">
              ${connectedSystems.map(system => `<span class="rounded-full bg-neutral-100 dark:bg-neutral-700 px-2.5 py-1 text-xs text-neutral-600 dark:text-neutral-300">${escapeHtml(system)}</span>`).join('')}
            </div>
          </div>
        `;
      }

      if ((!connectedSystems || connectedSystems.length === 0) && (!openQuestions || openQuestions.length === 0)) {
        html += `<div class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800 p-4 text-sm text-neutral-400">沒有待確認事項或關聯系統</div>`;
      }

      html += `</div></div>`; // close right column + cards-grid

      // Timeline — 來源 design-system/examples/vibeprompts-activity-feed.html 的圖案
      if (manifest.entries && manifest.entries.length > 0) {
        html += `
          <div id="history" class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-800">
            <div class="border-b border-neutral-200 dark:border-neutral-700 p-4">
              <h2 class="flex items-center gap-2 font-semibold text-neutral-900 dark:text-neutral-50">
                <span class="h-4 w-4 text-neutral-400">${ICONS.history}</span>
                歷史紀錄
              </h2>
            </div>
            <ol class="relative space-y-6 p-5 pl-11">
              <span class="absolute bottom-6 left-6 top-6 w-px -translate-x-1/2 bg-neutral-200 dark:bg-neutral-700"></span>
              ${manifest.entries.map((entry, idx) => {
                const entryId = `entry-${idx}`;
                return `
                  <li class="relative">
                    <span class="absolute -left-7 top-1 h-4 w-4 rounded-full bg-neutral-200 dark:bg-neutral-600 ring-4 ring-white dark:ring-neutral-800"></span>
                    <button type="button" onclick="toggleTimelineEntry('${entryId}')" class="text-left w-full">
                      <p class="text-xs text-neutral-400 tabular-nums">${escapeHtml(entry.date)}</p>
                      <p class="text-sm font-medium text-neutral-900 dark:text-neutral-50 flex items-center gap-1.5 mt-0.5">
                        <span id="${entryId}-icon" class="h-3 w-3 text-neutral-400 transition-transform">${ICONS.chevron}</span>
                        ${escapeHtml(entry.topic)}
                      </p>
                    </button>
                    <div id="${entryId}-details" class="hidden mt-2 rounded-xl bg-neutral-50 dark:bg-neutral-700/40 p-3 text-sm text-neutral-600 dark:text-neutral-300">
                      <div id="${entryId}-summary">載入中...</div>
                      <div id="${entryId}-decisions" class="mt-2"></div>
                    </div>
                  </li>
                `;
              }).join('')}
            </ol>
          </div>
        `;
      }

      // Technical details — AI/engineer-only, collapsed by default
      if ((keyFiles && keyFiles.length > 0) || (changesInProgress && changesInProgress.length > 0)) {
        html += `
          <details class="mt-8 pt-6 border-t border-neutral-200 dark:border-neutral-800">
            <summary class="flex items-center gap-2 font-semibold text-sm text-neutral-500 dark:text-neutral-400 cursor-pointer">
              <span class="h-4 w-4">${ICONS.code}</span>
              技術細節（給 AI／工程師看）
            </summary>
            <p class="mt-3 text-xs text-neutral-400">以下是給 AI 或工程師對接用的原始檔名、技術代號與連結，一般閱讀不需要看這段。</p>
            <div class="mt-4 space-y-4">
              ${(changesInProgress && changesInProgress.length > 0) ? `
                <div>
                  <h3 class="text-[11px] font-semibold uppercase tracking-wide text-neutral-400 mb-2">SR 技術代號對照</h3>
                  <div class="font-mono text-xs text-neutral-400 space-y-1">
                    ${changesInProgress.map(change => `<div>${escapeHtml(change.display_name || change.name || '未命名')} → <code class="text-neutral-500 dark:text-neutral-300">${escapeHtml(change.name || '')}</code></div>`).join('')}
                  </div>
                </div>
              ` : ''}
              ${(keyFiles && keyFiles.length > 0) ? `
                <div>
                  <h3 class="text-[11px] font-semibold uppercase tracking-wide text-neutral-400 mb-2">重要檔案</h3>
                  <div class="flex flex-wrap gap-2">
                    ${keyFiles.map(file => `<span class="rounded-lg border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 px-2.5 py-1 text-xs font-mono text-neutral-500 dark:text-neutral-400">${escapeHtml(file)}</span>`).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          </details>
        `;
      }

      APP_CONTAINER.innerHTML = html;

      // Load entry details asynchronously
      if (manifest.entries && manifest.entries.length > 0) {
        manifest.entries.forEach((entry, idx) => {
          const entryId = `entry-${idx}`;
          loadEntryDetails(entryId, entry.file);
        });
      }
    }

    function renderDetailText(text) {
      return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong class="text-neutral-900 dark:text-neutral-50">$1</strong>');
    }

    function toggleTimelineEntry(entryId) {
      const details = document.getElementById(`${entryId}-details`);
      const icon = document.getElementById(`${entryId}-icon`);
      const isHidden = details.classList.contains('hidden');
      details.classList.toggle('hidden', !isHidden);
      icon.classList.toggle('rotate-90', isHidden);
    }

    async function loadEntryDetails(entryId, filename) {
      const summaryEl = document.getElementById(`${entryId}-summary`);
      const decisionsEl = document.getElementById(`${entryId}-decisions`);
      if (!summaryEl) return;

      try {
        const response = await fetch(`./entries/${filename}`);
        if (!response.ok) throw new Error(`Failed to fetch entry: ${response.status}`);
        const entry = await response.json();

        summaryEl.textContent = entry.summary || '無摘要';

        if (entry.decisions && entry.decisions.length > 0) {
          decisionsEl.innerHTML = entry.decisions.map(d =>
            `<span class="inline-block mr-1.5 mb-1.5 rounded-lg bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 px-2 py-1 text-xs text-neutral-600 dark:text-neutral-300">${escapeHtml(d)}</span>`
          ).join('');
        }
      } catch (error) {
        summaryEl.textContent = 'Not available';
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTimestamp(ts) {
      if (!ts || ts === 'Unknown') return 'Unknown';
      try {
        const date = new Date(ts);
        if (isNaN(date.getTime())) return ts;
        return date.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch {
        return ts;
      }
    }

    applyTheme();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadDashboard);
    } else {
      loadDashboard();
    }
  </script>

</body>
</html>
